name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies (also generates the Prisma client)
        run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker compose up (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - name: Start the whole stack
        run: docker compose up --build -d

      - name: Wait for GET /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          echo "api did not become healthy"; exit 1

      - name: PUT /test/clock works with CLOCK_MODE=test
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://localhost:3000/test/clock \
            -H 'content-type: application/json' -d '{"now":"2027-03-27T09:00:00Z"}')
          test "$status" = "204"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
